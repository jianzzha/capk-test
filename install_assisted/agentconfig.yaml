apiVersion: agent-install.openshift.io/v1beta1
kind: AgentServiceConfig
metadata:
  name: agent
  annotations:
    agent-install.openshift.io/enable-image-service: "false"
    unsupported.agent-install.openshift.io/assisted-service-pvc-prefix: "pvc-"
spec:
  databaseStorage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: "10Gi"
  filesystemStorage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: "10Gi"
  imageStorage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: "10Gi"
  osImages: []
